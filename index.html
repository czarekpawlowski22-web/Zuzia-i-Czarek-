<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Czarek & Zuzia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080808;
    color: #fff;
    font-family: "Inter", sans-serif;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

/* HEADER */

header {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

header h1 {
    font-size: clamp(45px, 9vw, 100px);
    font-weight: 600;
    letter-spacing: -4px;
}

header p {
    margin-top: 15px;
    color: #999;
    font-size: 15px;
}

/* COUNTER */

.counter-section {
    padding: 80px 0;
    text-align: center;
}

.counter-title {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.counter {
    display: flex;
    justify-content: center;
    gap: 45px;
    flex-wrap: wrap;
}

.counter div {
    min-width: 80px;
}

.number {
    font-size: 42px;
    font-weight: 600;
}

.label {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

/* PHOTOS */

.photos {
    padding: 80px 0;
}

.section-title {
    font-size: 30px;
    margin-bottom: 30px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    background: #151515;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.015);
}

/* MAP */

.travel {
    padding: 80px 0;
}

#map {
    height: 550px;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 30px;
}

.places {
    margin-top: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.place {
    border: 1px solid #292929;
    padding: 10px 15px;
    border-radius: 100px;
    color: #bbb;
    font-size: 13px;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 80px 0 40px;
    color: #555;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 700px) {

    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }

    .counter {
        gap: 25px;
    }

    .number {
        font-size: 32px;
    }

    #map {
        height: 450px;
    }

}

</style>
</head>

<body>

<header>

    <div>
        <h1>Czarek & Zuzia</h1>
        <p>01.12.2023 — ∞</p>
    </div>

</header>


<section class="counter-section">

    <div class="container">

        <div class="counter-title">
            Razem już
        </div>

        <div class="counter">

            <div>
                <div class="number" id="days">0</div>
                <div class="label">dni</div>
            </div>

            <div>
                <div class="number" id="hours">0</div>
                <div class="label">godzin</div>
            </div>

            <div>
                <div class="number" id="minutes">0</div>
                <div class="label">minut</div>
            </div>

            <div>
                <div class="number" id="seconds">0</div>
                <div class="label">sekund</div>
            </div>

        </div>

    </div>

</section>


<section class="photos">

    <div class="container">

        <h2 class="section-title">Zdjęcia</h2>

        <div class="gallery">

            <!-- TUTAJ BĘDZIEMY DODAWAĆ ZDJĘCIA -->

            <img src="zdjecie1.jpg" alt="">
            <img src="zdjecie2.jpg" alt="">
            <img src="zdjecie3.jpg" alt="">
            <img src="zdjecie4.jpg" alt="">
            <img src="zdjecie5.jpg" alt="">
            <img src="zdjecie6.jpg" alt="">

        </div>

    </div>

</section>


<section class="travel">

    <div class="container">

        <h2 class="section-title">Podróże</h2>

        <div id="map"></div>

        <div class="places">

            <div class="place">🇵🇱 Polska</div>
            <div class="place">🇭🇺 Budapeszt</div>
            <div class="place">🇮🇹 Rzym</div>
            <div class="place">🇮🇹 Mediolan</div>
            <div class="place">🇮🇹 Jezioro Garda</div>
            <div class="place">🇫🇷 Nicea</div>
            <div class="place">🇫🇷 Antibes</div>
            <div class="place">🇲🇨 Monako</div>
            <div class="place">🇫🇷 Menton</div>

        </div>

    </div>

</section>


<footer>
    01.12.2023
</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* LICZNIK */

const startDate = new Date("2023-12-01T00:00:00");

function updateCounter() {

    const now = new Date();

    const difference = now - startDate;

    const secondsTotal = Math.floor(difference / 1000);

    const days = Math.floor(secondsTotal / 86400);

    const hours = Math.floor((secondsTotal % 86400) / 3600);

    const minutes = Math.floor((secondsTotal % 3600) / 60);

    const seconds = secondsTotal % 60;

    document.getElementById("days").textContent = days;

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCounter();

setInterval(updateCounter, 1000);


/* MAPA */

const map = L.map("map").setView([45.5, 10], 5);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* MIEJSCA */

const places = [

    {
        name: "Budapeszt 🇭🇺",
        lat: 47.4979,
        lng: 19.0402
    },

    {
        name: "Rzym 🇮🇹",
        lat: 41.9028,
        lng: 12.4964
    },

    {
        name: "Mediolan 🇮🇹",
        lat: 45.4642,
        lng: 9.1900
    },

    {
        name: "Jezioro Garda 🇮🇹",
        lat: 45.6049,
        lng: 10.6687
    },

    {
        name: "Nicea 🇫🇷",
        lat: 43.7102,
        lng: 7.2620
    },

    {
        name: "Antibes 🇫🇷",
        lat: 43.5808,
        lng: 7.1239
    },

    {
        name: "Monako 🇲🇨",
        lat: 43.7384,
        lng: 7.4246
    },

    {
        name: "Menton 🇫🇷",
        lat: 43.7765,
        lng: 7.5044
    },

    {
        name: "Polska 🇵🇱",
        lat: 52.0693,
        lng: 19.4803
    }

];


places.forEach(place => {

    L.marker([place.lat, place.lng])
        .addTo(map)
        .bindPopup(`<b>${place.name}</b>`);

});

</script>

</body>
</html>
